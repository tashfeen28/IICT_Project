<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log in or create a Coffee Circle demo account to earn rewards.">
  <title>Login or Register | The Coffee Circle</title>
  <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style_i263069.css">
  <link rel="stylesheet" href="../css/components_i263069.css">
  <link rel="stylesheet" href="../css/responsive_i263069.css">
</head>
<body data-root="../">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero ">
      <div class="container">
        <p class="eyebrow">Join the Circle</p>
        <h1>Login &amp; Registration</h1>
        <p>Log in to earn points, redeem free coffee and see your orders.</p>
      </div>
    </section>
    <section class="section">
      <div class="container auth-wrap">
        <div class="form-card">
          <div class="tabs" role="tablist" aria-label="Login or register">
            <button type="button" class="tab active" role="tab" data-tab="login" aria-selected="true">Login</button>
            <button type="button" class="tab" role="tab" data-tab="register" aria-selected="false">Register</button>
          </div>
          <p id="auth-status" class="form-message" role="status"></p>

          <form id="login-form" novalidate>
            <div class="field"><label for="l-id">Username or email</label><input id="l-id" name="identifier" type="text" autocomplete="username"><span class="field-error" data-error-for="identifier"></span></div>
            <div class="field"><label for="l-pass">Password</label><input id="l-pass" name="password" type="password" autocomplete="current-password"><span class="field-error" data-error-for="password"></span></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
            <p class="center small" style="margin-top:14px">New here? <button type="button" class="link-inline" data-switch="register">Create an account</button></p>
          </form>

          <form id="register-form" novalidate hidden>
            <div class="field"><label for="r-name">Full name</label><input id="r-name" name="fullName" type="text" autocomplete="name"><span class="field-error" data-error-for="fullName"></span></div>
            <div class="field"><label for="r-email">Email address</label><input id="r-email" name="email" type="email" autocomplete="email"><span class="field-error" data-error-for="email"></span></div>
            <div class="field"><label for="r-user">Username</label><input id="r-user" name="username" type="text" autocomplete="username"><span class="field-hint">3-20 characters: letters, numbers, underscore.</span><span class="field-error" data-error-for="username"></span></div>
            <div class="field"><label for="r-pass">Password</label><input id="r-pass" name="password" type="password" autocomplete="new-password"><span class="field-hint">At least 6 characters. Use a throwaway demo password, never a real one.</span><span class="field-error" data-error-for="password"></span></div>
            <div class="field"><label for="r-confirm">Confirm password</label><input id="r-confirm" name="confirm" type="password" autocomplete="new-password"><span class="field-error" data-error-for="confirm"></span></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
            <p class="center small" style="margin-top:14px">Already a member? <button type="button" class="link-inline" data-switch="login">Log in</button></p>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/products_i263069.js"></script>
  <script src="../js/main_i263069.js"></script>
  <script src="../js/auth_i263069.js"></script>
  <script src="../js/cart_i263069.js"></script>
  <script src="../js/loyalty_i263069.js"></script>
  <script src="../js/navigation_i263069.js"></script>
</body>
</html>
